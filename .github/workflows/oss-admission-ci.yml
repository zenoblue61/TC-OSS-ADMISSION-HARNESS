name: OSS Admission Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OSS admissions
        run: python3 scripts/validate_admissions.py
      - name: Run admission contract tests
        run: python3 -m unittest discover -s tests -v
