name: OSS Admission Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to an immutable commit SHA per OSS_ADMISSION_POLICY.md rule 2.
      # Admitted as oss-actions-checkout in registry/oss-registry.json.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify ledger projection
        # Runs before the validator because validate_admissions.py rewrites
        # evidence/validation-result.json: projecting afterwards would read that
        # run's output instead of the committed evidence. This is a
        # non-authoritative smoke test — output stays in RUNNER_TEMP, is never
        # uploaded, and is discarded when the run ends.
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/project_ledger.py \
            --source-commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/ledger-projection-a.json" > /dev/null
          python3 scripts/project_ledger.py \
            --source-commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/ledger-projection-b.json" > /dev/null
          cmp "$RUNNER_TEMP/ledger-projection-a.json" \
              "$RUNNER_TEMP/ledger-projection-b.json"
          python3 -c 'import json, os, sys
path = os.path.join(os.environ["RUNNER_TEMP"], "ledger-projection-b.json")
with open(path, encoding="utf-8") as handle:
    actual = json.load(handle)["source_commit"]
expected = os.environ["SOURCE_COMMIT"]
if actual != expected:
    sys.exit(f"source_commit {actual} does not match GITHUB_SHA {expected}")'
      - name: Validate OSS admissions
        run: python3 scripts/validate_admissions.py
      - name: Discover OSS dependency candidates
        # --check fails when the committed evidence is stale or any manifest is
        # missing/malformed; --strict additionally fails when any candidate is
        # not ADMITTED_MATCH. The two are independent, so both are required to
        # gate freshness and admission. --check also keeps the run read-only:
        # without it, discovery would rewrite the evidence file in place.
        run: python3 scripts/discover_dependencies.py --check --strict
      - name: Run admission contract tests
        run: python3 -m unittest discover -s tests -v
