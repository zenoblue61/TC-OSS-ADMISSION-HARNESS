[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-project"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.27.0", "pydantic>=2.0"]

[project.optional-dependencies]
docs = ["mkdocs==1.6.0"]

[tool.poetry.dependencies]
python = "^3.11"
rich = "^13.7.0"
typer = "0.12.3"
poetry-git-lib = { git = "https://github.com/example/poetry-lib.git", rev = "3333333333333333333333333333333333333333" }
poetry-tag-lib = { git = "https://github.com/example/poetry-tag.git", tag = "v2.0.0" }
